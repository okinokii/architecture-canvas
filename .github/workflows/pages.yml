name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare site
        shell: bash
        run: |
          mkdir -p public
          cp architecture-canvas/index.html architecture-canvas/core.js architecture-canvas/presets.js public/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          # Уникальное имя: повторный запуск не должен конфликтовать
          # со старым артефактом github-pages из предыдущей попытки.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
