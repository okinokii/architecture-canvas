name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # удаляем старые артефакты github-pages перед новой загрузкой

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare site
        shell: bash
        run: |
          mkdir -p public
          cp architecture-canvas/index.html architecture-canvas/core.js architecture-canvas/presets.js public/
          cp LICENSE public/

      # actions/deploy-pages требует ровно один артефакт с именем github-pages.
      # После rerun старые артефакты остаются — удаляем их заранее.
      - name: Remove old Pages artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" --paginate \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
          while read -r id; do
            [ -n "$id" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null
          done

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # API артефактов может немного запаздывать: deploy-pages иначе падает
      # с «No artifacts named github-pages» сразу после успешной загрузки.
      - name: Wait for Pages artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" -ge 1 ]; then echo "Artifact is visible"; exit 0; fi
            sleep 2
          done
          echo "Artifact github-pages did not become visible" >&2
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
