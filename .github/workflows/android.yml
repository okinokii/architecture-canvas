name: APK и офлайн-архив

# Сборка запускается вручную: Actions → «APK и офлайн-архив» → Run workflow.
# Запуск на теге дополнительно прикрепляет файлы к релизу.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # теги нужны, чтобы имя файлов содержало версию Release

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # На ubuntu-latest Android SDK уже установлен.
      - name: Configure Android SDK tools
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install required SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Prepare downloads
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(git describe --tags --abbrev=0 || echo "${GITHUB_REF_NAME}")"
          echo "Version: $VERSION"
          mkdir -p dist standalone-build
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ArchitectureCanvas-${VERSION}.apk"
          cp architecture-canvas/index.html architecture-canvas/core.js architecture-canvas/presets.js LICENSE standalone/START.txt standalone-build/
          (cd standalone-build && zip -q -r "../dist/ArchitectureCanvas-standalone-${VERSION}.zip" .)

      - name: Upload downloads
        uses: actions/upload-artifact@v4
        with:
          name: architecture-canvas-dist
          path: dist/*
          if-no-files-found: error

      - name: Attach downloads to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          overwrite: true
